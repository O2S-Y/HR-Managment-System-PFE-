00" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="240.6035" x="419.781" y="475.6816">Appliquer la d&#233;duction CNSS (Taux fixe)</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="256.0215" x="412.072" y="508.5117"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="236.0215" x="422.072" y="529.6504">Appliquer la d&#233;duction AMO (Taux fixe)</text><path d="M686.4353,566.8984 L686.4353,575.4648 L666.4353,579.4648 L686.4353,583.4648 L686.4353,592.0313 A0,0 0 0 0 686.4353,592.0313 L941.5051,592.0313 A0,0 0 0 0 941.5051,592.0313 L941.5051,576.8984 L931.5051,566.8984 L686.4353,566.8984 A0,0 0 0 0 686.4353,566.8984" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M931.5051,566.8984 L931.5051,576.8984 L941.5051,576.8984 L931.5051,566.8984" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="234.0698" x="692.4353" y="583.9653">SNI = Brut - Frais pro. - CNSS - AMO</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="252.7051" x="413.7302" y="562.4805"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="232.7051" x="423.7302" y="583.6191">Calculer le Salaire Net Imposable (SNI)</text><polygon fill="#F1F1F1" points="37,616.4492,256.5542,616.4492,268.5542,628.4492,256.5542,640.4492,37,640.4492,25,628.4492,37,616.4492" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="111.1548" x="150.7771" y="650.6597">Tranche 1 : Exon&#233;r&#233;</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="219.5542" x="37" y="632.2573">SNI appartient &#224; quelle tranche de l'IR ?</text><rect fill="#F1F1F1" hei