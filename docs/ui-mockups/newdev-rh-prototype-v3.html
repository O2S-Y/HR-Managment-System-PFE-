                  const max = Math.max(...data.map(d => d.amount));
                  const W = 300, H = 180, pad = { top: 10, bottom: 28, left: 10, right: 10 };
                  const chartH = H - pad.top - pad.bottom;
                  const barW = (W - pad.left - pad.right) / data.length;
                  const barPad = barW * 0.3;
                  return (
                    <svg viewBox={`0 0 ${W} ${H}`} width="100%" height="100%">
                      {[0, 0.25, 0.5, 0.75, 1].map((t, i) => {
                        const y = pad.top + chartH * (1 - t);
                        return <line key={i} x1={pad.left} x2={W - pad.right} y1={y} y2={y} stroke="#E5E7EB" strokeDasharray="4 2" />;
                      })}
                      {data.map((d, i) => {
                        const bh = (d.amount / max) * chartH;
                        const x = pad.left + i * barW + barPad / 2;
                        const y = pad.top + chartH - bh;
                        const bw = barW - barPad;
                        return (
                          <g key={i}>
                            <rect x={x} y={y} width={bw} height={bh} fill="#5BC4E0" rx="3" />
                            <text x={x + bw / 2} y={H - 8} textAnchor="middle" fontSize="11" fill="#9E9E9E">{d.name}</text>
